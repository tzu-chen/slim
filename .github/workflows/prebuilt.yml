name: Prebuilt Linux binaries

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      RUST_TOOLCHAIN: '1.99.1'
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 binutils

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add "$TARGET" --toolchain "$RUST_TOOLCHAIN"
          rustc +"$RUST_TOOLCHAIN" --version
          cargo +"$RUST_TOOLCHAIN" --version

      - name: Run tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked --target "$TARGET"

      - name: Build release executable
        run: cargo +"$RUST_TOOLCHAIN" build --release --locked --target "$TARGET" --bin slim

      - name: Exercise release executable without a terminal
        env:
          SLIM_CACHE_DIR: ${{ runner.temp }}/slim-cache
          SLIM_DATA_DIR: ${{ runner.temp }}/slim-data
        run: |
          BIN="target/$TARGET/release/slim"
          "$BIN" --version
          "$BIN" --help
          "$BIN" scan fixtures/demo
          "$BIN" info fixtures/demo

      - name: Package binary and build information
        run: |
          VERSION=$(cargo +"$RUST_TOOLCHAIN" metadata --no-deps --format-version 1 --locked |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "slim"))')
          NAME="slim-v${VERSION}-${TARGET}"
          DIR="dist/$NAME"
          mkdir -p "$DIR/licenses"
          cp "target/$TARGET/release/slim" "$DIR/slim"
          cp LICENSE THIRD-PARTY-NOTICES.md README.md "$DIR/"
          cp assets/grammars/LICENSE-vscode-lean4.txt "$DIR/licenses/"
          {
            echo "commit=$GITHUB_SHA"
            echo "version=$VERSION"
            echo "target=$TARGET"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            rustc +"$RUST_TOOLCHAIN" --version
            ldd --version | sed -n 1p
          } > "$DIR/BUILD-INFO.txt"
          ldd "$DIR/slim" > "$DIR/RUNTIME-LIBRARIES.txt"
          readelf --version-info "$DIR/slim" > "$DIR/ELF-VERSION-INFO.txt"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")

      - name: Upload archives for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slim-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
