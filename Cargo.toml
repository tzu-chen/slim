[package]
name = "slim"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A fast terminal navigator for reading large Lean 4 projects"
license = "Apache-2.0"
repository = "https://github.com/tzu-chen/slim"
publish = false
default-run = "slim"

[[bin]]
name = "slim"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
memchr = "2"
onig = { version = "6.5", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.10"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
