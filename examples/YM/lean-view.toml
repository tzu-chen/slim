[[objective]]
decl = "YMReview.Acceptance.combined_acceptance"
title = "Combined review acceptance (A7)"
purpose = "One Wilson family and one Final per refinement satisfy the review clauses together."
explanation = "Read CombinedAcceptance for the quantifiers, Accepted for the clauses and accepted_of_source for their assembly. The proof lives in checks/CombinedAcceptance.lean; verification/AcceptanceChallenge.lean is an intentionally separate reference with the same declaration name.\n\nThe solution is checks/CombinedAcceptance.lean. The separate verification/AcceptanceChallenge.lean intentionally declares the same name with a placeholder proof. A whole-repository source index therefore reports this name as ambiguous; choose the checks/ solution in the declaration browser. The proof obtains its witnesses once from YangMills.constructed and invokes accepted_of_source.\n\nSource: submissions/openai-20261028/checks/CombinedAcceptance.lean:111."
paper = [
  { text = "The combined witness", source = "scope" },
]
limitations = [
  "Source-only whole-repository navigation reports two candidates for this name; choose the checks/ solution.",
  "No mass gap, confinement, intrinsic reference mass, unique infinite-volume limit or all-orders perturbative matching is asserted.",
  "This name has two source candidates by design; source_sha256 records the solution file.",
  "Combined acceptance does not assert a mass gap, confinement, infinite-volume uniqueness or all-orders perturbative matching.",
]
