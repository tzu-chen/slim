# Architecture map for the YM results and verification repository
# (https://github.com/yang-mills-group/YM), shipped with slim as an example of a
# project map for a large formalization. slim's docs/guide.md walks through it.
# Schema 1 is documented in slim's docs/map.md. All curation below is an
# unaccepted AI suggestion based on the source at the recorded revision.
# It is not a Lean dependency export, proof audit, or human acceptance record.
#
# Open the REPOSITORY ROOT so submission, checks, and examples are indexed:
#   slim path/to/YM --map examples/YM/lean-view.toml
#   slim map check path/to/YM --map examples/YM/lean-view.toml
# (or copy this file to the root of the YM checkout and run `slim path/to/YM`).
# In the UI: M map; * pin goal; A curated argument; T shared reading trails;
# S skim a group; / declaration search; r reload while viewing the map.
#
# Expected source-only ambiguity (not missing declarations): the two review
# endpoint names occur in both checks/ solutions and verification/ references.
# map check reports exactly these TWO unresolved/ambiguous names. Their hashes
# below fingerprint the checks/ solution files. Navigate to those files in the
# declaration browser; do not interpret a reference placeholder as the solution.
# YangMills.jointExistence and duplicated provenance definitions are explained in
# prose/module locators instead of adding more ambiguous declaration anchors.
#
# Source module locators below are paths relative to the repository root, with
# slashes replaced by dots; they are not the Lake import names of the nested
# ym_core package. Original submitted files are untouched.

schema = 1

[project]
name = "YM"
title = "YM — October construction and independent review"
description = "A suggested reading map of the 28 October 2026 submission and the A1–A8 review checks. Start with the three endpoints, then follow their mathematical components and reading trails. The source claims, review specifications, examples and dated verification evidence are distinct. No mass gap or unique infinite-volume limit is claimed here. Two review endpoint names are intentionally ambiguous in a repository-wide source scan because their frozen reference statements are also present; choose the checks/ solutions. This map validates navigation only and does not rerun Lean or Comparator."
revision = "55ba9fc36293b3f4d52c6b1f813169a0be76ee98"

