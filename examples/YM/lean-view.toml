[[objective]]
decl = "YangMills.constructed"
title = "Submitted joint continuum construction"
purpose = "A fixed Wilson family supports joint reconstruction, OPE, trace and contact conclusions after refinement."
explanation = "This is the detailed submitted theorem. The public YangMills.jointExistence theorem in submission/Solution.lean projects it to YangMills.JointExistence. Use this uniquely named entry point because the public theorem also has a same-name reference placeholder.\n\nFix the positive blocking-kernel penalty first. For each requested extraction order, choose a refinement, table, Final, all-phase reconstruction, OPE reader, contact devices and comparison data together. Solution.lean projects this to YangMills.jointExistence. The latter name also occurs in the intentional Challenge.lean reference placeholder, so this uniquely named theorem is the map entry point.\n\nSource: submissions/openai-20261028/submission/Construction.lean:15."
paper = [
  { text = "The public challenge; The detailed construction theorem", source = "submitted" },
]
limitations = [
  "This map is an account of the repository’s architecture, not a new verification of the claimed mathematics.",
  "The construction permits volume refinement; it does not supply a mass-gap or infinite-volume uniqueness theorem.",
  "This map describes the submitted statement and proof organization; it is not a new kernel or Comparator check.",
  "The result does not assert an infinite-volume uniqueness theorem or a positive mass gap.",
]
origin = "ai-suggestion"
