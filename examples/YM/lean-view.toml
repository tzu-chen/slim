# Argument entries

[[argument]]
goal = "YMReview.Acceptance.combined_acceptance"
title = "How the combined review keeps one witness"
summary = "AI-suggested reading of checks/CombinedAcceptance.lean: obtain one joint source witness, then prove all clauses for that F. These are curated steps, not a semantic dependency export."
origin = "ai-suggestion"
steps = [
  { decl = "YangMills.constructed", why = "Choose the family once and obtain the joint source data for each refinement." },
  { decl = "YMReview.Acceptance.accepted_of_source", why = "Assemble the clauses without taking a fresh existence witness for each one." },
  { decl = "YMReview.Acceptance.lattice_and_scale", why = "Supply the finite-law, limits and calibration clause.", for = "YMReview.Acceptance.accepted_of_source" },
  { decl = "YMReview.Acceptance.finite_law_on_family", why = "Match the finite Wilson measures after dividing by the representation dimension.", for = "YMReview.Acceptance.lattice_and_scale" },
  { decl = "YMLGTBridge.law_preserving", why = "Transport the law under link reindexing.", for = "YMReview.Acceptance.finite_law_on_family" },
  { decl = "YMReview.Acceptance.phase_and_os", why = "Use the same phase average and selected trace throughout.", for = "YMReview.Acceptance.accepted_of_source" },
  { decl = "YMOSBridge.verifiedOS", why = "Insert the complete scalar OS record.", for = "YMReview.Acceptance.phase_and_os" },
  { decl = "YMOSBridge.verifiedOS_growth", why = "Attach E0-prime for that same record.", for = "YMReview.Acceptance.phase_and_os" },
  { decl = "YMReview.Acceptance.translation_ward", why = "Keep the fixed translation normalization and window statements.", for = "YMReview.Acceptance.accepted_of_source" },
  { decl = "YMReview.Acceptance.operator_content", why = "Retain the field dictionary and dense faithful representation.", for = "YMReview.Acceptance.accepted_of_source" },
  { decl = "YMReview.Acceptance.leading_trace", why = "Use the trace tests from the joint source certificate, not a new AF existence theorem.", for = "YMReview.Acceptance.accepted_of_source" },
  { decl = "YMReview.TwoPointScale.mass_limit", why = "Use the same trace and ordered limits for the positive lattice probe.", for = "YMReview.Acceptance.accepted_of_source" },
  { decl = "YMReview.Acceptance.SourceConclusions", why = "Repackage the remaining source certificates on their original witnesses.", for = "YMReview.Acceptance.accepted_of_source" },
]

