# lean-view map of the slim demo library (schema: docs/map.md).
#
# This file was written for the demo together with the miniature library in this
# directory. It is curation, not verification: groups, purposes and the curated
# argument below are explanations for a reader. slim reads this file and never
# rewrites it; edit it and press `r` in the map view to reload.
#
# Two entries are deliberately imperfect so the demo shows how they are reported:
#   * the landmark `Demo.Graph.searchWithin_complete` names a declaration that lives
#     in `Demo.Fixtures` (an unresolved reference, with a rename hint);
#   * one purpose is marked as an unaccepted AI suggestion.

schema = 1

[project]
name = "slim_demo"
title = "slim_demo: relations, closures and reachability"
description = """
A miniature original library used as slim's demo and test fixture. Its mathematical
core is small on purpose; the `Fixtures` modules contain deliberate test fixtures.
"""

[[source]]
id = "readme"
citation = "fixtures/demo/README.md of the slim repository"

# ---------------------------------------------------------------------------
# Main results: chosen by the author of this map, not inferred.
# ---------------------------------------------------------------------------

[[objective]]
decl = "Demo.Graph.searchWithin_sound"
title = "Soundness of the fuel-bounded search"
purpose = "If the Boolean search answers true, the target really is reachable from the source."
explanation = """
The search is a depth-first exploration that spends one unit of fuel per edge. Soundness is
proved by recursion on the fuel: with no fuel the search only accepts `s = t`; otherwise a
successful search found a successor `w` of `s` from which the smaller search succeeds, and
the edge `s → w` is put in front of the path obtained recursively.
"""
paper = [{ text = "section \"How the library hangs together\"", source = "readme" }]
limitations = ["Completeness (every reachable target is found with enough fuel) is not proved in the library; only a test fixture states it."]

[[objective]]
decl = "Demo.Rel.EqvGen.equivalence"
title = "The equivalence closure is an equivalence relation"
purpose = "The reflexive-transitive closure of the symmetric closure is reflexive, symmetric and transitive."

# ---------------------------------------------------------------------------
# Mathematical components
# ---------------------------------------------------------------------------

[[group]]
id = "relations"
title = "Relations and their closures"
order = 10
purpose = "Binary relations on a type, and the closure operators every later result is phrased with."

[[group]]
id = "rel-basic"
parent = "relations"
title = "Basic vocabulary"
order = 10
purpose = "Reflexive, symmetric and transitive relations, inclusion of relations, and extensionality."
landmarks = [
  "Demo.Rel",
  "Demo.Rel.Reflexive",
  "Demo.Rel.Symmetric",
  "Demo.Rel.Transitive",
  "Demo.Rel.Subrel",
  { decl = "Demo.Rel.Subrel.antisymm", role = "two inclusions give equality; rests on extensionality" },
  "Demo.Rel.ext",
]

[[group]]
id = "closure"
parent = "relations"
title = "Reflexive-transitive closure"
order = 20
purpose = "The inductive closure `ReflTransGen` and the lemmas shared by almost everything else."
explanation = """
`ReflTransGen r a b` says that `b` is reached from `a` by finitely many `r`-steps. It is
generated by `refl` and `tail` (append one step at the end); `head` prepends a step instead
and `trans` concatenates two chains.
"""
landmarks = [
  "Demo.Rel.ReflTransGen",
  "Demo.Rel.ReflTransGen.single",
  "Demo.Rel.ReflTransGen.trans",
  { decl = "Demo.Rel.ReflTransGen.head", role = "prepend one step to a chain" },
  "Demo.Rel.ReflTransGen.lift",
  "Demo.Rel.ReflTransGen.mono",
  { decl = "Demo.Rel.ReflTransGen.least", role = "minimality: the closure is the least reflexive transitive relation above r" },
  "Demo.Rel.ReflTransGen.idem",
  "Demo.Rel.TransGen",
  "Demo.Rel.transGen_iff_comp",
]

[[group]]
id = "equivalence"
parent = "relations"
title = "Equivalence closure"
order = 30
purpose = "Symmetric closure, symmetry of closures, and the generated equivalence relation."
landmarks = [
  "Demo.Rel.SymmClosure",
  "Demo.Rel.ReflTransGen.symmetric",
  "Demo.Rel.EqvGen",
  "Demo.Rel.EqvGen.equivalence",
]

[[group]]
id = "graphs"
title = "Finite graphs and reachability"
order = 20
purpose = "Graphs given by an edge list; reachability is the closure of adjacency."
landmarks = [
  "Demo.Graph",
  "Demo.Graph.Adj",
  { decl = "Demo.Graph.Reach", role = "reachability, defined as ReflTransGen of Adj" },
  "Demo.Graph.Reach.trans",
  "Demo.Graph.Reach.mono",
  "Demo.Graph.succsOf",
  { decl = "Demo.Graph.mem_succsOf", role = "the successor list contains exactly the endpoints of edges" },
]

[[group]]
id = "search"
title = "Fuel-bounded search"
order = 30
purpose = "A Boolean depth-first search with a fuel bound, and its soundness theorem."
landmarks = [
  "Demo.Graph.anyOf",
  "Demo.Graph.anyOf_eq_true",
  "Demo.Graph.anyOf_of_mem",
  "Demo.Graph.searchWithin",
  "Demo.Graph.searchWithin_step",
  "Demo.Graph.searchWithin_sound",
  # The same declaration is also placed in the closure group: one identity, two placements.
  { decl = "Demo.Rel.ReflTransGen.head", role = "the last step of the soundness proof" },
]

[[group]]
id = "fixtures"
title = "Deliberate test fixtures (not results)"
order = 90
purpose = "Declarations that exist so that missing proofs, custom axioms and compiler trust have something to show."
limitations = [
  "Nothing in this group is a mathematical result of the library.",
  "`searchWithin_complete` is stated with `sorry`; declarations that use it inherit the placeholder.",
]
landmarks = [
  "Demo.Fixtures.searchWithin_complete",
  { decl = "Demo.Fixtures.searchWithin_correct", role = "no `sorry` in its text, yet it depends on one" },
  "Demo.Fixtures.oracle_axiom",
  "Demo.Fixtures.sample_search_native",
  # Deliberately wrong namespace: reported under "Unresolved references".
  "Demo.Graph.searchWithin_complete",
]

# ---------------------------------------------------------------------------
# External foundations: library declarations listed on purpose.
# ---------------------------------------------------------------------------

[[group]]
id = "core"
kind = "foundation"
title = "Core Lean"
order = 10
purpose = "The library uses only core Lean. These are the library notions and axioms its results visibly rest on."
landmarks = [
  { decl = "Equivalence", role = "the structure EqvGen.equivalence inhabits" },
  { decl = "List.Mem", role = "membership in edge lists" },
  { decl = "propext", role = "standard axiom behind relation extensionality" },
  { decl = "Classical.em", role = "used by the classical dichotomy on reflexivity" },
]

# ---------------------------------------------------------------------------
# Annotations of single declarations
# ---------------------------------------------------------------------------

[[landmark]]
decl = "Demo.Rel.ReflTransGen.head"
purpose = "From one step `a → b` and a chain from `b` to `c`, a chain from `a` to `c`."

[[landmark]]
decl = "Demo.Graph.Reach"
purpose = "`g.Reach u v`: there is a path from `u` to `v` along the edges of `g`."

[[landmark]]
decl = "Demo.Graph.searchWithin"
purpose = "`g.searchWithin fuel s t`: a Boolean search for a path from `s` to `t` using at most `fuel` edges."

[[landmark]]
decl = "Demo.Rel.transGen_iff_comp"
purpose = "The transitive closure is one step followed by the reflexive-transitive closure."
origin = "ai-suggestion"

[[landmark]]
decl = "Demo.Fixtures.searchWithin_complete"
purpose = "TEST FIXTURE: completeness of the search, stated with a deliberately missing proof."

# ---------------------------------------------------------------------------
# A curated argument: how the soundness theorem is proved, step by step.
# "A uses B" runs from a statement to its prerequisite.
# ---------------------------------------------------------------------------

[[argument]]
goal = "Demo.Graph.searchWithin_sound"
title = "Why the search is sound"
summary = "Recursion on the fuel; the successful branch yields an edge and a shorter successful search."
steps = [
  { decl = "Demo.Graph.searchWithin", why = "unfold the search: with fuel n+1 it accepts s = t or some successor w with a successful search of fuel n" },
  { decl = "Demo.Graph.anyOf_eq_true", why = "a true `anyOf` produces a concrete successor w that passes the test" },
  { decl = "Demo.Graph.mem_succsOf", why = "membership in the successor list means (s, w) is an edge of the graph" },
  { decl = "Demo.Rel.ReflTransGen.head", why = "put the edge s → w in front of the path from w to t given by the recursive call" },
  { decl = "Demo.Rel.ReflTransGen.single", for = "Demo.Rel.ReflTransGen.head", why = "one step is a chain" },
  { decl = "Demo.Rel.ReflTransGen.trans", for = "Demo.Rel.ReflTransGen.head", why = "chains concatenate" },
  { decl = "Demo.Graph.mem_cons_iff", for = "Demo.Graph.mem_succsOf", why = "membership in a cons cell, proved by cases" },
]

[[relation]]
from = "Demo.Graph.searchWithin_sound"
to = "Demo.Graph.Reach"
kind = "is stated with"
note = "the conclusion `g.Reach s t` is reachability"

[[relation]]
from = "Demo.Graph.Reach"
to = "Demo.Rel.ReflTransGen"
kind = "is defined as"
note = "Reach is the reflexive-transitive closure of adjacency"
evidence = "SlimDemo/Graph/Basic.lean"

# ---------------------------------------------------------------------------
# A shared reading trail. A reader starts it (T, Enter) to get a personal copy.
# ---------------------------------------------------------------------------

[[trail]]
id = "soundness"
title = "The soundness of bounded search in ten minutes"
description = "From graphs to the main theorem, in an order chosen for reading. It is not a dependency order."
stops = [
  { group = "graphs", note = "start with what a graph and reachability are" },
  { decl = "Demo.Graph.Reach", note = "reachability is a closure: everything about paths comes from ReflTransGen" },
  { decl = "Demo.Rel.ReflTransGen", note = "two constructors: stop, or append one step" },
  { decl = "Demo.Graph.searchWithin", note = "the algorithm; read the two equations" },
  { decl = "Demo.Graph.anyOf_eq_true", note = "how a Boolean `true` becomes a witness" },
  { decl = "Demo.Rel.ReflTransGen.head", note = "the step the proof ends with" },
  { decl = "Demo.Graph.searchWithin_sound", note = "the main result: follow the curated argument in the goal explorer (*, then A)" },
  { decl = "Demo.Fixtures.searchWithin_complete", note = "the converse is only a test fixture", question = "What would a proof of completeness need as its fuel bound?" },
]
